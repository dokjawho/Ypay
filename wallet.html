<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ypay · Wallet</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="ambient"></div>
<div class="shell">
  <aside class="sidebar" id="sidebar" data-page="wallet"></aside>
  <main class="main">
    <header class="page-header">
      <div class="page-title-block">
        <div class="page-title"><em>Wallet</em></div>
        <div class="page-subtitle">Real-time balance · async payments</div>
      </div>
      <div class="header-tools">
        <button class="header-add-btn" id="btnAdd">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Add Money
        </button>
      </div>
    </header>

    <div style="padding:28px 36px;flex:1;overflow-y:auto">
      <!-- Hero -->
      <div class="wallet-hero animate">
        <div class="wallet-hero-left">
          <div class="wallet-hero-label">Available Balance</div>
          <div class="wallet-hero-amount" id="heroBalance">—</div>
          <div class="wallet-hero-sub" id="heroSub">Loading…</div>
        </div>
        <div class="wallet-hero-right">
          <div class="net-pill net-owed" id="pillOwed" style="display:none">↑ <span id="owedAmt"></span> owed to you</div>
          <div class="net-pill net-owe"  id="pillOwe"  style="display:none">↓ You owe <span id="oweAmt"></span></div>
        </div>
      </div>

      <!-- Quick actions -->
      <div class="wallet-actions animate delay-1">
        <div class="wallet-action-card" id="qAdd">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg><span>Add Money</span>
        </div>
        <div class="wallet-action-card" id="qSend">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span>Send Money</span>
        </div>
        <div class="wallet-action-card" id="qReq">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Request</span>
        </div>
      </div>

      <div style="display:flex;gap:24px">
        <!-- Transactions -->
        <div style="flex:1;min-width:0">
          <div style="font-family:var(--fser);font-size:22px;font-style:italic;font-weight:300;margin-bottom:14px">Transaction History</div>
          <div style="display:flex;gap:6px;margin-bottom:14px">
            <button class="filter-btn active" data-tf="all">All</button>
            <button class="filter-btn" data-tf="credit">Received</button>
            <button class="filter-btn" data-tf="debit">Sent</button>
          </div>
          <div id="walletTxList" style="display:flex;flex-direction:column;gap:2px"></div>
        </div>
        <!-- Requests -->
        <div style="width:280px;flex-shrink:0">
          <div style="font-family:var(--fser);font-size:22px;font-style:italic;font-weight:300;margin-bottom:14px">Money Requests</div>
          <div id="requestList"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="shared.js"></script>
<script>
  let txFilter='all';

  function refresh() {
    const stats    = Wallet.getStats();
    const owedToMe = Splits.getOwedToMe();
    const iOwe     = Splits.getIOwed();
    document.getElementById('heroBalance').textContent = formatINR(stats.balance);
    document.getElementById('heroSub').textContent     = `In: ${formatINR(stats.income)} · Out: ${formatINR(stats.expense)}`;
    const p1=document.getElementById('pillOwed'), p2=document.getElementById('pillOwe');
    owedToMe>0 ? (p1.style.display='flex', document.getElementById('owedAmt').textContent=formatINR(owedToMe)) : p1.style.display='none';
    iOwe>0     ? (p2.style.display='flex', document.getElementById('oweAmt').textContent=formatINR(iOwe))     : p2.style.display='none';
    renderTxs(); renderRequests();
  }

  // HOF: filter chain
  function renderTxs() {
    const txs = Wallet.getTransactions().filter(t => txFilter==='all'||t.type===txFilter);
    document.getElementById('walletTxList').innerHTML =
      txs.length ? txs.map(renderTxItem).join('') :
      `<div class="empty-state" style="padding:30px 10px"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>No transactions here</p></div>`;
  }

  function renderRequests() {
    const reqs=Payments.getAllRequests();
    if (!reqs.length) { document.getElementById('requestList').innerHTML=`<div class="empty-state" style="padding:30px 10px"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><p>No requests yet</p></div>`; return; }
    document.getElementById('requestList').innerHTML = reqs.map(req => {
      const f=Friends.getById(req.fromId);
      const pending=req.status==='pending';
      return `<div class="request-item">${renderAvatar(f,38)}
        <div class="request-info"><div class="request-name">${f?.name??'Unknown'}</div><div class="request-note">${req.note||'No note'} · ${req.date}</div></div>
        <div class="request-amount">${formatINR(req.amount)}</div>
        ${pending?`<button class="request-accept-btn" id="acc-${req.id}" onclick="acceptReq('${req.id}')">Accept</button><button class="request-decline-btn" onclick="declineReq('${req.id}')">✕</button>`
                 :`<span style="font-size:11px;color:var(--text-dim);padding:4px 8px;background:var(--surface2);border-radius:6px">${req.status}</span>`}
      </div>`;
    }).join('');
  }

  // async event handlers with try/catch
  window.acceptReq = async id => {
    const btn=document.getElementById('acc-'+id);
    if(btn) { btn.disabled=true; btn.textContent='…'; }
    try {
      const res=await Payments.acceptRequest(id);
      if(res.ok) { refresh(); showToast('Payment received! 💸'); }
      else       { showToast(res.error,'error'); }
    } catch(err) { showToast('Failed','error'); console.error(err); }
  };

  window.declineReq = async id => {
    try {
      await Payments.declineRequest(id); refresh(); showToast('Request declined');
    } catch(err) { showToast('Failed','error'); }
  };

  // DOM event: filter tabs
  document.querySelectorAll('[data-tf]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-tf]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); txFilter=btn.dataset.tf; renderTxs();
    });
  });

  // Shared modal builder (async confirm handlers)
  function doAddModal() {
    openModal('Add Money', `
      <div class="form-row">
        <div class="form-group"><label class="form-label">Amount (₹)</label><input class="form-input" id="m-amt" type="number" min="1" placeholder="0" autofocus/></div>
        <div class="form-group"><label class="form-label">Via</label><select class="form-select" id="m-src"><option>UPI</option><option>Bank Transfer</option><option>Card</option><option>Cash</option></select></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${[500,1000,2000,5000,10000].map(v=>`<button onclick="document.getElementById('m-amt').value=${v}" style="padding:5px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);font-size:12px;cursor:pointer">+₹${v.toLocaleString('en-IN')}</button>`).join('')}
      </div>`, {
      confirmLabel:'Add to Wallet',
      onConfirm: async () => {
        const btn=document.getElementById('_modal-confirm');
        const amt=parseFloat(document.getElementById('m-amt').value);
        const src=document.getElementById('m-src').value;
        if(!amt||amt<=0) { showToast('Enter a valid amount','error'); return; }
        setLoading(btn,true);
        try {
          const res=await Wallet.addMoney(amt);
          if(res.ok) { closeModal(); refresh(); showToast(`${formatINR(amt)} added via ${src}!`); }
          else       { showToast(res.error,'error'); }
        } catch(err) { showToast('Failed','error'); }
        finally      { setLoading(btn,false); }
      }
    });
    setTimeout(()=>document.getElementById('m-amt')?.focus(),50);
  }

  function doSendModal() {
    const friends=Friends.getAll();
    if(!friends.length) { showToast('Add a friend first!','error'); return; }
    openModal('Send Money', `
      <div class="form-group"><label class="form-label">To</label><select class="form-select" id="m-to">${friends.map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Amount (₹)</label><input class="form-input" id="m-amt" type="number" min="1" placeholder="0" autofocus/></div>
      <div class="form-group"><label class="form-label">Note</label><input class="form-input" id="m-note" type="text" placeholder="optional"/></div>
      <div style="font-size:12px;color:var(--text-dim)">Balance: <strong style="color:var(--gold)">${formatINR(Wallet.getBalance())}</strong></div>`, {
      confirmLabel:'Send',
      onConfirm: async () => {
        const btn=document.getElementById('_modal-confirm');
        const toId=document.getElementById('m-to').value;
        const amt=parseFloat(document.getElementById('m-amt').value);
        const note=document.getElementById('m-note').value;
        setLoading(btn,true);
        try {
          const res=await Payments.send(toId,amt,note);
          if(res.ok) { closeModal(); refresh(); showToast(`Sent ${formatINR(amt)} to ${Friends.getName(toId)}`); }
          else       { showToast(res.error,'error'); }
        } catch(err) { showToast('Transfer failed','error'); }
        finally      { setLoading(btn,false); }
      }
    });
  }

  function doReqModal() {
    const friends=Friends.getAll();
    if(!friends.length) { showToast('Add a friend first!','error'); return; }
    openModal('Request Money', `
      <div class="form-group"><label class="form-label">From</label><select class="form-select" id="m-from">${friends.map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Amount (₹)</label><input class="form-input" id="m-amt" type="number" min="1" placeholder="0" autofocus/></div>
      <div class="form-group"><label class="form-label">Reason</label><input class="form-input" id="m-note" type="text" placeholder="e.g. cab fare"/></div>
      <div style="font-size:12px;color:var(--text-dim);background:var(--surface);border-radius:8px;padding:10px">💡 Simulate acceptance on this page after sending.</div>`, {
      confirmLabel:'Send Request',
      onConfirm: async () => {
        const btn=document.getElementById('_modal-confirm');
        const fromId=document.getElementById('m-from').value;
        const amt=parseFloat(document.getElementById('m-amt').value);
        const note=document.getElementById('m-note').value;
        setLoading(btn,true);
        try {
          const res=await Payments.createRequest(fromId,amt,note);
          if(res.ok) { closeModal(); refresh(); showToast(`Request sent to ${Friends.getName(fromId)}`); }
          else       { showToast(res.error,'error'); }
        } catch(err) { showToast('Failed','error'); }
        finally      { setLoading(btn,false); }
      }
    });
  }

  document.getElementById('btnAdd').onclick = doAddModal;
  document.getElementById('qAdd').onclick   = doAddModal;
  document.getElementById('qSend').onclick  = doSendModal;
  document.getElementById('qReq').onclick   = doReqModal;

  refresh();
</script>
</body>
</html>
