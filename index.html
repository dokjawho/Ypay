<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ypay · Dashboard</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="ambient"></div>
<div class="shell">
  <aside class="sidebar" id="sidebar" data-page="dashboard"></aside>
  <main class="main">
    <header class="page-header">
      <div class="page-title-block">
        <div class="page-title">Good morning, <em>Arjun</em></div>
        <div class="page-subtitle" id="dateStr"></div>
      </div>
      <div class="header-tools">
        <div class="search-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Search transactions…"/>
        </div>
        <!-- Live rate badge — populated by fetchExchangeRate() -->
        <div id="rateBadge" style="display:flex;align-items:center;gap:7px;padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:12px;color:var(--text-dim)">
          <span>💱</span><span id="rateText">Fetching rate…</span>
        </div>
      </div>
    </header>

    <div class="body">
      <!-- LEFT -->
      <div class="col-l">
        <div class="card-3d animate">
          <div class="pay-card" id="payCard">
            <div class="card-shimmer"></div><div class="card-rings"></div>
            <div class="card-top">
              <div><div class="card-logo-text">ypay</div><div class="card-tier">Obsidian Reserve</div></div>
              <svg class="chip" viewBox="0 0 40 30" fill="none"><rect width="40" height="30" rx="5" fill="#c9a84c" opacity=".88"/><rect x="4" y="4" width="32" height="22" rx="3" fill="none" stroke="#7a5c10" stroke-width=".7" opacity=".6"/><line x1="13" y1="4" x2="13" y2="26" stroke="#7a5c10" stroke-width=".6" opacity=".5"/><line x1="27" y1="4" x2="27" y2="26" stroke="#7a5c10" stroke-width=".6" opacity=".5"/><line x1="4" y1="11" x2="36" y2="11" stroke="#7a5c10" stroke-width=".6" opacity=".5"/><line x1="4" y1="20" x2="36" y2="20" stroke="#7a5c10" stroke-width=".6" opacity=".5"/><rect x="13" y="11" width="14" height="9" rx="1" fill="#b8930c" opacity=".35"/></svg>
            </div>
            <div class="card-mid"><div class="card-number">4782 &nbsp;••••&nbsp; ••••&nbsp; 3091</div></div>
            <div class="card-bot">
              <div><div class="card-fl">Card Holder</div><div class="card-fv">ARJUN KAPOOR</div></div>
              <div><div class="card-fl">Valid Thru</div><div class="card-fvr">09 / 28</div></div>
              <div class="card-net"><span></span><span></span></div>
            </div>
          </div>
        </div>

        <div class="balance-row animate delay-1">
          <div class="balance-block">
            <div class="balance-label">Available Balance</div>
            <div class="balance-value" id="dashBalance">—</div>
            <div class="balance-sub">Updated just now</div>
            <div class="prog-track"><div class="prog-fill" id="dashProg" style="width:0%"></div></div>
          </div>
          <div class="balance-block">
            <div class="balance-label">Split Balance</div>
            <div class="balance-value" id="dashSplitNet" style="font-size:18px;padding-top:4px">—</div>
            <div class="balance-sub" id="dashSplitSub">Calculating…</div>
            <div class="prog-track"><div class="prog-fill g" style="width:50%"></div></div>
          </div>
        </div>

        <div class="actions-row animate delay-2">
          <button class="action-btn" id="btnAdd">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Add Money
          </button>
          <button class="action-btn" id="btnSend">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Send
          </button>
          <button class="action-btn" id="btnReq">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Request
          </button>
        </div>

        <div class="animate delay-3">
          <div class="section-label">Spend this month</div>
          <div class="spend-bars" id="spendBars"></div>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="col-r">
        <div class="card-grid-3">
          <div class="glass-card animate delay-1">
            <div class="stat-icon-row"><div class="stat-icon" style="background:var(--gold-dim)"><svg fill="none" stroke="var(--gold)" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div></div>
            <div class="stat-val" id="statBalance">—</div><div class="stat-lbl">Net Balance</div>
          </div>
          <div class="glass-card animate delay-2">
            <div class="stat-icon-row"><div class="stat-icon" style="background:var(--green-bg)"><svg fill="none" stroke="var(--green)" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></div></div>
            <div class="stat-val" id="statIncome">—</div><div class="stat-lbl">Money In</div>
          </div>
          <div class="glass-card animate delay-3">
            <div class="stat-icon-row"><div class="stat-icon" style="background:var(--red-bg)"><svg fill="none" stroke="var(--red)" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></div></div>
            <div class="stat-val" id="statExpense">—</div><div class="stat-lbl">Money Out</div>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;flex:1">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
            <div style="font-family:var(--fser);font-size:22px;font-style:italic;font-weight:300">Recent Transactions</div>
            <div class="filter-row">
              <button class="filter-btn active" data-filter="all">All</button>
              <button class="filter-btn" data-filter="credit">Income</button>
              <button class="filter-btn" data-filter="debit">Expenses</button>
            </div>
          </div>
          <div id="txList" style="display:flex;flex-direction:column;gap:2px"></div>
          <div class="no-results" id="noResults"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>No transactions found</p></div>
          <a href="transactions.html" style="margin-top:14px;text-align:center;font-size:12.5px;color:var(--text-dim);text-decoration:none">View all →</a>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="shared.js"></script>
<script>
  document.getElementById('dateStr').textContent =
    new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  // Card tilt — DOM event: mousemove
  const card = document.getElementById('payCard');
  document.querySelector('.card-3d').addEventListener('mousemove', e => {
    const r=card.getBoundingClientRect();
    card.style.transform=`rotateY(${((e.clientX-r.left)/r.width-.5)*12}deg) rotateX(${-((e.clientY-r.top)/r.height-.5)*8}deg) scale(1.02)`;
  });
  document.querySelector('.card-3d').addEventListener('mouseleave', () => card.style.transform='');

  // Render dashboard stats — pure sync reads
  function refreshDash() {
    const stats    = Wallet.getStats();
    const owedToMe = Splits.getOwedToMe();
    const iOwe     = Splits.getIOwed();
    const net      = owedToMe - iOwe;

    document.getElementById('dashBalance').textContent = formatINR(stats.balance);
    document.getElementById('dashProg').style.width    = Math.min(100,(stats.balance/500000)*100)+'%';
    document.getElementById('statBalance').textContent = formatINR(stats.balance);
    document.getElementById('statIncome').textContent  = formatINR(stats.income);
    document.getElementById('statExpense').textContent = formatINR(stats.expense);

    const sn  = document.getElementById('dashSplitNet');
    const sub = document.getElementById('dashSplitSub');
    if (net>0)      { sn.style.color='var(--green)'; sn.textContent='+'+formatINR(net);        sub.textContent='Others owe you'; }
    else if (net<0) { sn.style.color='var(--red)';   sn.textContent='−'+formatINR(Math.abs(net)); sub.textContent='You owe others'; }
    else            { sn.style.color='var(--text-dim)'; sn.textContent='₹0'; sub.textContent='All settled!'; }

    // HOF: filter + reduce + sort + slice → spend bars
    const cats   = {};
    Wallet.getTransactions()
      .filter(t => t.type==='debit')                    // HOF: filter
      .forEach(t => { cats[t.category]=(cats[t.category]||0)+t.amount; });
    const sorted = Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,4);
    const max    = sorted[0]?.[1]||1;
    document.getElementById('spendBars').innerHTML = sorted
      .map(([cat,amt]) => `<div class="spend-row"><span class="spend-name">${cat}</span><div class="spend-track"><div class="spend-fill" style="width:${Math.round(amt/max*100)}%"></div></div><span class="spend-amount">${formatINR(amt)}</span></div>`)
      .join('');                                         // HOF: map

    renderTxList();
  }

  // HOF: filter chain for tx list
  let activeFilter='all', searchVal='';
  function renderTxList() {
    const txs = Wallet.getTransactions()
      .filter(tx => activeFilter==='all' || tx.type===activeFilter)  // HOF: filter
      .filter(tx => tx.description.toLowerCase().includes(searchVal) || tx.category.toLowerCase().includes(searchVal))
      .slice(0,8);
    document.getElementById('txList').innerHTML = txs.map(renderTxItem).join(''); // HOF: map
    document.getElementById('noResults').classList.toggle('visible', txs.length===0);
  }

  // DOM events: click (filter), input (search)
  document.querySelectorAll('[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-filter]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); activeFilter=btn.dataset.filter; renderTxList();
    });
  });
  document.getElementById('searchInput').addEventListener('input', e => {
    searchVal=e.target.value.toLowerCase(); renderTxList();
  });

  /* ── async: fetch live exchange rate ── */
  (async () => {
    const result = await fetchExchangeRate();    // await
    const el     = document.getElementById('rateText');
    if (result.rate) {
      el.textContent      = `1 USD = ₹${result.rate.toFixed(2)}`;
      el.style.color      = 'var(--green)';
      document.getElementById('rateBadge').title = `Source: ${result.source} · ${result.updated}`;
    } else {
      el.textContent = 'Rate unavailable';
    }
  })();

  /* ── async: Add Money with try/catch + setLoading ── */
  document.getElementById('btnAdd').addEventListener('click', () => {
    openModal('Add Money', `
      <div class="form-group"><label class="form-label">Amount (₹)</label>
        <input class="form-input" id="m-amt" type="number" min="1" placeholder="0" autofocus/></div>
      <div class="form-group"><label class="form-label">Source</label>
        <select class="form-select" id="m-src"><option>UPI</option><option>Bank Transfer</option><option>Card</option><option>Cash</option></select></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${[500,1000,2000,5000].map(v=>`<button onclick="document.getElementById('m-amt').value=${v}" style="padding:5px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);font-size:12px;cursor:pointer">+₹${v.toLocaleString('en-IN')}</button>`).join('')}
      </div>`, {
      confirmLabel:'Add Money',
      onConfirm: async () => {                         // async handler
        const btn = document.getElementById('_modal-confirm');
        const amt = parseFloat(document.getElementById('m-amt').value);
        const src = document.getElementById('m-src').value;
        if (!amt||amt<=0) { showToast('Enter a valid amount','error'); return; }
        setLoading(btn, true);
        try {
          const res = await Wallet.addMoney(amt);      // await
          if (res.ok) { closeModal(); refreshDash(); showToast(`${formatINR(amt)} added via ${src}!`); }
          else        { showToast(res.error,'error'); }
        } catch (err) {                                // try/catch
          showToast('Something went wrong','error');
          console.error(err);
        } finally {
          setLoading(btn, false);
        }
      }
    });
    setTimeout(()=>document.getElementById('m-amt')?.focus(),50);
  });

  /* ── async: Send money ── */
  document.getElementById('btnSend').addEventListener('click', () => {
    const friends=Friends.getAll();
    if (!friends.length) { showToast('Add a friend first!','error'); return; }
    openModal('Send Money', `
      <div class="form-group"><label class="form-label">To</label>
        <select class="form-select" id="m-to">${friends.map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Amount (₹)</label>
        <input class="form-input" id="m-amt" type="number" min="1" placeholder="0" autofocus/></div>
      <div class="form-group"><label class="form-label">Note (optional)</label>
        <input class="form-input" id="m-note" type="text" placeholder="What's this for?"/></div>
      <div style="font-size:12px;color:var(--text-dim)">Balance: <strong style="color:var(--gold)">${formatINR(Wallet.getBalance())}</strong></div>`, {
      confirmLabel:'Send',
      onConfirm: async () => {
        const btn  = document.getElementById('_modal-confirm');
        const toId = document.getElementById('m-to').value;
        const amt  = parseFloat(document.getElementById('m-amt').value);
        const note = document.getElementById('m-note').value;
        setLoading(btn, true);
        try {
          const res = await Payments.send(toId, amt, note);
          if (res.ok) { closeModal(); refreshDash(); showToast(`Sent ${formatINR(amt)} to ${Friends.getName(toId)}`); }
          else        { showToast(res.error,'error'); }
        } catch(err) { showToast('Transfer failed','error'); console.error(err); }
        finally      { setLoading(btn, false); }
      }
    });
  });

  /* ── async: Request money ── */
  document.getElementById('btnReq').addEventListener('click', () => {
    const friends=Friends.getAll();
    if (!friends.length) { showToast('Add a friend first!','error'); return; }
    openModal('Request Money', `
      <div class="form-group"><label class="form-label">From</label>
        <select class="form-select" id="m-from">${friends.map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Amount (₹)</label>
        <input class="form-input" id="m-amt" type="number" min="1" placeholder="0" autofocus/></div>
      <div class="form-group"><label class="form-label">Reason</label>
        <input class="form-input" id="m-note" type="text" placeholder="e.g. last night's dinner"/></div>`, {
      confirmLabel:'Send Request',
      onConfirm: async () => {
        const btn    = document.getElementById('_modal-confirm');
        const fromId = document.getElementById('m-from').value;
        const amt    = parseFloat(document.getElementById('m-amt').value);
        const note   = document.getElementById('m-note').value;
        setLoading(btn, true);
        try {
          const res = await Payments.createRequest(fromId, amt, note);
          if (res.ok) { closeModal(); showToast(`Request sent to ${Friends.getName(fromId)}`); }
          else        { showToast(res.error,'error'); }
        } catch(err) { showToast('Failed to send request','error'); }
        finally      { setLoading(btn, false); }
      }
    });
  });

  refreshDash();
</script>
</body>
</html>
